<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamora Admin Panel | لوحة التحكم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09070e; --surface-solid: #171122; --surface-muted: #21182e;
      --ink: #f7f3ff; --muted: #b8afc7; --line: rgba(229, 216, 255, .13);
      --accent: #00f3ff; --accent-strong: #0284c7; --danger: #e64e64;
    }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--ink); margin: 0; display: flex; min-height: 100vh; }
    
    /* Login Screen */
    #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-box { background: var(--surface-solid); padding: 40px; border-radius: 24px; border: 1px solid var(--accent); box-shadow: 0 10px 40px rgba(0,243,255,0.1); width: 100%; max-width: 400px; text-align: center; }
    .login-box h1 { font-family: 'Montserrat', sans-serif; color: var(--accent); letter-spacing: 2px; margin-bottom: 30px; }
    .form-input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-muted); color: var(--ink); font-size: 1rem; }
    .form-input:focus { border-color: var(--accent); outline: none; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #000; font-weight: 900; font-size: 1.1rem; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,243,255,0.3); }

    /* Dashboard Layout */
    #dashboard { display: none; width: 100%; flex-direction: column; }
    .header { padding: 20px 40px; background: var(--surface-solid); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .header h2 { margin: 0; color: var(--accent); font-family: 'Montserrat'; }
    .logout-btn { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    .container { padding: 40px; display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
    .card { background: var(--surface-solid); border: 1px solid var(--line); border-radius: 20px; padding: 25px; }
    .card h3 { margin-top: 0; color: var(--accent); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.9rem; }
    .product-list { max-height: 500px; overflow-y: auto; }
    .product-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface-muted); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid var(--line); }
    .product-info h4 { margin: 0 0 5px 0; }
    .product-info span { color: var(--accent); font-weight: bold; }
    .delete-btn { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-screen">
    <div class="login-box">
      <h1>GAMORA ADMIN</h1>
      <input type="text" id="admin-user" class="form-input" placeholder="اسم المستخدم (Username)">
      <input type="password" id="admin-pass" class="form-input" placeholder="كلمة المرور">
      <button class="btn" onclick="checkLogin()">دخول للوحة التحكم</button>
      <p id="login-error" style="color: var(--danger); display: none; margin-top: 15px;">بيانات الدخول غير صحيحة!</p>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="dashboard">
    <header class="header">
      <h2>GAMORA CONTROL PANEL</h2>
      <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </header>
    
    <div class="container">
      <!-- نموذج إضافة منتج -->
      <div class="card">
        <h3>إضافة منتج جديد</h3>
        <form id="add-product-form">
          <label>اسم المنتج</label>
          <input type="text" id="p-name" class="form-input" required>
          
          <label>القسم</label>
          <select id="p-category" class="form-input">
            <option value="devices">الأجهزة</option>
            <option value="accessories">الاكسسوارات</option>
            <option value="style">اللوك (ملابس)</option>
          </select>

          <label>السعر (بالجنيه)</label>
          <input type="number" id="p-price" class="form-input" required>

          <label>رابط الصورة (مسار الصورة)</label>
          <input type="text" id="p-image" class="form-input" placeholder="مثال: device/pc.png" required>

          <button type="submit" class="btn" style="margin-top: 15px;">إضافة للموقع</button>
        </form>
      </div>

      <!-- قائمة المنتجات -->
      <div class="card">
        <h3>إدارة المنتجات الحالية</h3>
        <div class="product-list" id="products-container">
          <p style="color: var(--muted); text-align: center;">جاري تحميل المنتجات...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- استدعاء Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // إعدادات قاعدة البيانات الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyBEtrijGax-o4mPQk34UX3gVYm81WEpD3I",
      authDomain: "gamora-d47d9.firebaseapp.com",
      projectId: "gamora-d47d9",
      storageBucket: "gamora-d47d9.firebasestorage.app",
      messagingSenderId: "349051835313",
      appId: "1:349051835313:web:9f0465f61aa68af7d4a390"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // التحقق من حالة تسجيل الدخول المحفوظة
    if (localStorage.getItem('gamora_admin_auth') === 'true') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      fetchProducts();
    }

    // دالة تسجيل الدخول (نظام حماية الواجهة)
    window.checkLogin = function() {
      const user = document.getElementById('admin-user').value.trim();
      const pass = document.getElementById('admin-pass').value;
      const errorMsg = document.getElementById('login-error');

      // التحقق من الحسابين الذين قمت بتحديدهم
      const isValidAdmin1 = (user === 'ADMIN' && pass === 'passWORDKAreem1996');
      const isValidAdmin2 = (user === 'ADMIN' && pass === 'HussienFekry800700');

      if (isValidAdmin1 || isValidAdmin2) {
        localStorage.setItem('gamora_admin_auth', 'true');
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        fetchProducts();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // تسجيل الخروج
    window.logout = function() {
      localStorage.removeItem('gamora_admin_auth');
      window.location.reload();
    }

    // إضافة منتج لقاعدة البيانات (Firebase Firestore)
    document.getElementById('add-product-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button');
      btn.textContent = 'جاري الإضافة...';
      
      try {
        await addDoc(collection(db, "products"), {
          name: document.getElementById('p-name').value,
          category: document.getElementById('p-category').value,
          price: Number(document.getElementById('p-price').value),
          image: document.getElementById('p-image').value,
          createdAt: new Date()
        });
        alert('تمت إضافة المنتج بنجاح!');
        this.reset();
        fetchProducts();
      } catch (error) {
        alert('حدث خطأ أثناء الإضافة: ' + error.message);
      } finally {
        btn.textContent = 'إضافة للموقع';
      }
    });

    // جلب المنتجات وعرضها
    async function fetchProducts() {
      const container = document.getElementById('products-container');
      container.innerHTML = '';
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        if(querySnapshot.empty) {
          container.innerHTML = '<p style="text-align:center;">لا توجد منتجات مضافة من لوحة التحكم حتى الآن.</p>';
          return;
        }
        querySnapshot.forEach((docSnap) => {
          const data = docSnap.data();
          container.innerHTML += `
            <div class="product-item">
              <div class="product-info">
                <h4>${data.name}</h4>
                <span>${data.price} ج.م</span> - <small style="color:#b8afc7">${data.category}</small>
              </div>
              <button class="delete-btn" onclick="deleteProduct('${docSnap.id}')">حذف</button>
            </div>
          `;
        });
      } catch (error) {
        console.error("Error fetching products:", error);
      }
    }

    // دالة حذف المنتج
    window.deleteProduct = async function(id) {
      if(confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) {
        try {
          await deleteDoc(doc(db, "products", id));
          fetchProducts();
        } catch (error) {
          alert('حدث خطأ أثناء الحذف.');
        }
      }
    }
  </script>
</body>
</html>
